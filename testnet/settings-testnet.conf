# Bitmark Homepage Generator — TESTNET runtime configuration
#
# Deploy to:  /home/server/etc-explorer/settings-testnet.conf
# Sourced by: /home/server/scripts/run-bitmark-hp-gen-testnet.sh
#
# This is the testnet twin of settings.conf.  Every value that would collide
# with the mainnet instance (port, web root, ZMQ endpoint, tmux session) is
# deliberately different — see the mainnet/testnet table in testnet/README.md.

# ── explorer identity ─────────────────────────────────────────────────────────

EXPLORER_DOMAIN=tbtm.plx.im

# Selects the chain this instance renders.  "testnet" makes the templates show
# the TESTNET badge and swap the mainnet-only plot links for a link back to the
# mainnet explorer.  Anything other than "mainnet" counts as a test network.
NETWORK=testnet

# ── paths ─────────────────────────────────────────────────────────────────────

# Testnet gets its own copy of the templates so that redeploying them can never
# disturb the mainnet explorer, which reads from bitmark-hp-gen/ next door.
TEMPLATE_PATH=/var/www/templates/bitmark-hp-gen-testnet/homepage.html
BLOCK_TEMPLATE_PATH=/var/www/templates/bitmark-hp-gen-testnet/blockdetail.html
ADDR_TEMPLATE_PATH=/var/www/templates/bitmark-hp-gen-testnet/addressdetail.html
MULTITX_TEMPLATE_PATH=/var/www/templates/bitmark-hp-gen-testnet/multitx.html

OUTPUT_PATH=/var/www/${EXPLORER_DOMAIN}/html/index.html
OUTPUT_DIR=/var/www/${EXPLORER_DOMAIN}/html
STATIC_DIR=/var/www/${EXPLORER_DOMAIN}/html

# ── HTTP server ───────────────────────────────────────────────────────────────

# 8088 is the mainnet instance — testnet must not collide with it.
LISTEN_ADDR=127.0.0.1:8089

# ── ZMQ ───────────────────────────────────────────────────────────────────────

# zmqpubhashblock of the *testnet* bitmarkd (mainnet publishes on 28332).
ZMQ_ENDPOINT=tcp://127.0.0.1:28432
ZMQ_RECV_TIMEOUT=120
ZMQ_RECONNECT_DELAY=5

# ── logging ───────────────────────────────────────────────────────────────────

LOG_PATH=/home/server/logs/bitmark-hp-gen-testnet.log

# ── tmux ──────────────────────────────────────────────────────────────────────

# Documentation only — the binary ignores this; it is install.sh that reads it.
TMUX_SESSION=page-generator-tn
TMUX_COLS=500
TMUX_ROWS=200
